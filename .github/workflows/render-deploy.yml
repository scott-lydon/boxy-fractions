# Render auto-deploy webhook bridge.
#
# WHY THIS EXISTS. Render's "Auto-Deploy: On Commit" setting depends on
# Render receiving GitHub push webhooks, which only happens when the repo
# is connected via the Render GitHub App. This repo was set up with
# Render's public-repo-URL flow, which never registers a webhook. The
# Manual Deploy button was the only path until now. This workflow closes
# that gap without the App-install OAuth dance: on every push to main,
# GitHub Actions POSTs to Render's deploy-hook URL and Render kicks off a
# build the same way it would for the Manual Deploy button.
#
# The hook URL is a SECRET. It is stored as a repo secret
# (RENDER_DEPLOY_HOOK_URL) so anyone who can read the workflow file
# cannot read the key. Rotate the hook from the Render dashboard
# Settings → Deploy Hook → Regenerate and re-set the secret if it leaks.
#
# Concurrency group keeps two rapid pushes from racing each other into
# competing builds; only the latest in-flight push survives.

name: Render auto-deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: render-deploy-main
  cancel-in-progress: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST to Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set on this repo."
            echo "::error::Fix: paste the URL from Render → Service → Settings → Deploy Hook"
            echo "::error::      into 'Settings → Secrets and variables → Actions' as RENDER_DEPLOY_HOOK_URL."
            exit 1
          fi
          # -fS makes curl exit non-zero on HTTP errors and still show error
          # text. We capture body+code in one shot so a 4xx/5xx is visible
          # in the workflow log, not a silent green-light.
          http_code=$(curl -sS -o response.txt -w '%{http_code}' -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "HTTP $http_code"
          echo "--- response ---"
          cat response.txt
          echo
          if [ "$http_code" -ge 400 ]; then
            echo "::error::Render returned HTTP $http_code. The deploy was NOT triggered."
            echo "::error::Common causes: hook URL revoked or regenerated; service paused; secret outdated."
            exit 1
          fi
          # Surface the Render deploy id (returned in the JSON body) so a
          # human watching the Actions tab can click through to the build.
          deploy_id=$(grep -oE '"deploy"[[:space:]]*:[[:space:]]*\{[^}]*"id"[[:space:]]*:[[:space:]]*"[^"]+"' response.txt | grep -oE '"id"[[:space:]]*:[[:space:]]*"[^"]+"' | grep -oE '"[^"]+"$' | tr -d '"' || true)
          if [ -n "${deploy_id:-}" ]; then
            echo "Render deploy id: $deploy_id"
            echo "Render dashboard: https://dashboard.render.com/static/srv-d867oofavr4c73dhcamg/deploys/$deploy_id"
          fi
