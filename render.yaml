# Render Blueprint for Boxy Fractions.
#
# When the user runs the Render "Apply Blueprint" flow against this repo,
# Render reads this file and sets up the Static Site below automatically:
#  - name: boxy-fractions
#  - build: npm ci && npm run build
#  - publish dir: dist
#  - auto-deploy on every push to main
#  - SPA pretty-URL rewrite for client-side routing (unused today, free anyway)
#
# To re-use a different region or domain later, edit this file and re-apply.

services:
  - type: web
    name: boxy-fractions
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    branch: main
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
